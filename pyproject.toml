[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "experimenter"
version = "0.1.0"
description = "ML experiment platform orchestrated by Claude — ask a question, get an ML-backed answer"

requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    # Claude / MCP
    "anthropic>=0.40.0",
    "mcp>=1.0.0",
    # Data sources
    "kaggle>=1.6.0",
    "huggingface-hub>=0.25.0",
    "datasets>=3.0.0",
    # Cloud — GCP
    "google-cloud-aiplatform>=1.70.0",
    "google-cloud-storage>=2.18.0",
    # Experiment tracking
    "wandb>=0.18.0",
    # ML
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pyarrow>=16.0.0",
    # Web / HTTP
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    # CLI / config
    "typer[all]>=0.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
nlp = [
    "transformers>=4.44.0",
    "torch>=2.4.0",
    "sentencepiece>=0.2.0",
    "accelerate>=0.34.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
]

[project.scripts]
experimenter     = "experimenter.cli:app"
experimenter-mcp = "experimenter.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/experimenter"]

[tool.hatch.envs.default]
python = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
